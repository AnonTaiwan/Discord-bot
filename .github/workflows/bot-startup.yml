name: Bot Startup
run-name: ${{ github.actor }} is Testing Bot Startup 

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  Bot-Startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Create and Activate Virtual Environment
      run: |
        python -m venv .venv

    - name: Install Dependencies
      run: |
        source .venv/bin/activate
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Setup Environment
      run: |
        source .venv/bin/activate
        scripts/manage.sh setup

    - name: Check Environment
      run: |
        source .venv/bin/activate
        scripts/manage.sh check
      env:
        CI_RUNNING: true

    - name: Set Discord Bot Config
      env:
        DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_FOR_CI_TOKEN }}
      run: |
        cp config/sample-config.yaml config/config.yaml
        sed -i "s/Put your discord bot token here/${DISCORD_BOT_TOKEN}/" config/config.yaml
        sed -i 's/discord_id_1/123456789012345678/' config/config.yaml
        sed -i 's/discord_id_2/123456789012345678/' config/config.yaml
        sed -i 's/discord_id_3/123456789012345678/' config/config.yaml

    - name: Start Bot
      id: start-bot
      run: |
        source .venv/bin/activate
        scripts/manage.sh start
      env:
        CI_RUNNING: true
      continue-on-error: true

    - name: Check Logs
      run: |
        if [ -f logs/bot_stdout.log ]; then
          echo "Bot log output:"
          cat logs/bot_stdout.log
        else
          echo "Log file not found. Bot may not have started correctly."
          exit 1
        fi

    - name: Throw Error if Bot Failed to Start
      if: ${{ steps.start-bot.outcome == 'failure' }}
      run: |
        echo "Bot failed to start. Please check the logs for more details."
        exit 1